<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* RO Contenidos · build 2026-09-12 · desarrollo: 2248 Digital */

/* ===== src/styles/tokens.css ===== */
/* ============================================================================
   TOKENS — Identidad RO Contenidos
   Cambiando este archivo el mismo CORE sirve a otro medio (2248 Media Systems)
   ========================================================================== */

:root {
  /* --- superficie -------------------------------------------------------- */
  --bg:        #0B0C0E;
  --bg-2:      #101216;
  --bg-3:      #15181D;
  --bg-4:      #1D2128;
  --bg-glass:  rgba(11, 12, 14, .86);

  --line:      #23272E;
  --line-2:    #2F343C;

  /* --- texto ------------------------------------------------------------- */
  --fg:        #F4F5F7;
  --fg-2:      #B9BFC7;
  --fg-3:      #838B95;

  /* --- marca ------------------------------------------------------------- */
  --red:       #FF5656;
  --red-2:     #E23B3B;
  --red-soft:  rgba(255, 86, 86, .12);
  --red-line:  rgba(255, 86, 86, .34);
  --on-red:    #16070A;

  /* --- tipografía -------------------------------------------------------- */
  --ff-ui: 'Archivo', 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif;
  --ff-serif: 'Source Serif 4', 'Iowan Old Style', Georgia, 'Times New Roman', serif;

  --fs-kicker: .6875rem;   /* 11px — etiquetas */
  --fs-meta:   .8125rem;   /* 13px */
  --fs-sm:     .875rem;    /* 14px */
  --fs-base:   1rem;
  --fs-lead:   1.0625rem;

  /* --- geometría --------------------------------------------------------- */
  --r-xs: 4px;
  --r-sm: 6px;
  --r:    10px;
  --r-lg: 14px;
  --r-pill: 999px;

  --gutter: 20px;
  --maxw: 1280px;
  --maxw-read: 44rem;

  --player-h: 78px;
  --header-h: 60px;

  /* --- movimiento -------------------------------------------------------- */
  --t-fast: 120ms cubic-bezier(.2, .7, .3, 1);
  --t:      180ms cubic-bezier(.2, .7, .3, 1);

  --shadow-1: 0 1px 2px rgba(0,0,0,.5);
  --shadow-2: 0 10px 30px rgba(0,0,0,.45);

  color-scheme: dark;
}

@media (min-width: 700px)  { :root { --gutter: 28px; --player-h: 84px; --header-h: 64px; } }
@media (min-width: 1100px) { :root { --gutter: 32px; } }


/* ===== src/styles/app.css ===== */
/* ============================================================================
   RO CONTENIDOS — hoja principal
   ========================================================================== */

/* -------------------------------------------------------------- 1 · base */
*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--ff-ui);
  font-size: var(--fs-base);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  padding-bottom: calc(var(--player-h) + 4px + env(safe-area-inset-bottom, 0px));
}

img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
h1, h2, h3, h4 { margin: 0; font-weight: 700; line-height: 1.14; letter-spacing: -.018em; }
p  { margin: 0; }
ul { margin: 0; padding: 0; list-style: none; }

:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; border-radius: var(--r-xs); }

::selection { background: var(--red); color: var(--on-red); }

/* scrollbar discreta */
* { scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
*::-webkit-scrollbar { width: 10px; height: 10px; }
*::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 99px; border: 3px solid var(--bg); }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ------------------------------------------------------------ 2 · layout */
.wrap { width: 100%; max-width: var(--maxw); margin: 0 auto; padding-inline: var(--gutter); }

.cols {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 40px;
}
@media (min-width: 1080px) {
  .cols { grid-template-columns: minmax(0, 1fr) 300px; gap: 44px; }
}

.rail { display: none; }
@media (min-width: 1080px) { .rail { display: grid; gap: 34px; align-content: start; } }
.rail-sticky { position: sticky; top: calc(var(--header-h) + 20px); }
.m-only { display: block; }
@media (min-width: 1080px) { .m-only { display: none; } }

.block { margin-top: 44px; }
.block:first-child { margin-top: 0; }

.divider { height: 1px; background: var(--line); border: 0; margin: 0; }

/* --------------------------------------------------- 3 · encabezado/nav */
.topbar {
  background: var(--bg-2);
  border-bottom: 1px solid var(--line);
  font-size: var(--fs-meta);
  color: var(--fg-3);
}
.topbar-in { display: flex; align-items: center; gap: 16px; height: 36px; }
.topbar .fecha { text-transform: capitalize; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .spacer { flex: 1; }
.topbar .tb-links { display: none; gap: 14px; }
@media (min-width: 860px) { .topbar .tb-links { display: flex; } }
.topbar a:hover { color: var(--fg); }

.header {
  position: sticky; top: 0; z-index: 60;
  background: var(--bg-glass);
  backdrop-filter: saturate(150%) blur(14px);
  -webkit-backdrop-filter: saturate(150%) blur(14px);
  border-bottom: 1px solid var(--line);
}
.header-in { display: flex; align-items: center; gap: 14px; height: var(--header-h); }

/* logotipo real de RO Contenidos */
.logo { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
.brand-logo { display: block; height: var(--bl-h, 34px); }
.brand-logo img { display: block; height: 100%; width: auto; max-width: 220px; object-fit: contain; }

/* logos de emisoras: contenedor fijo, imagen siempre contain, nunca deformada */
.station-logo {
  display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto;
  width: var(--sl-size, 32px); height: var(--sl-size, 32px);
  border-radius: var(--r-sm); overflow: hidden; background: var(--bg-4);
}
.station-logo img { width: 100%; height: 100%; object-fit: contain; }

/* menú "Más" (categorías secundarias, escritorio) */
.nav-more { position: relative; }
.nav-more-btn {
  display: flex; align-items: center; gap: 5px; padding: 7px 10px; border-radius: var(--r-sm);
  font-size: var(--fs-sm); font-weight: 500; color: var(--fg-2);
}
.nav-more-btn svg { width: 13px; height: 13px; transform: rotate(180deg); transition: transform var(--t-fast); }
.nav-more-btn:hover { color: var(--fg); background: var(--bg-3); }
.nav-more-menu {
  display: none; position: absolute; top: calc(100% + 6px); left: 0; min-width: 190px;
  background: var(--bg-3); border: 1px solid var(--line-2); border-radius: var(--r);
  box-shadow: var(--shadow-2); padding: 6px; flex-direction: column; gap: 1px; z-index: 70;
}
.nav-more-menu.open { display: flex; }
.nav-more-menu.open ~ .nav-more-btn svg,
.nav-more:has(.nav-more-menu.open) .nav-more-btn svg { transform: rotate(0deg); }
.nav-more-menu a { padding: 8px 10px; border-radius: var(--r-sm); font-size: var(--fs-sm); color: var(--fg-2); }
.nav-more-menu a:hover { background: var(--bg-4); color: var(--fg); }
.nav-more-menu a.on { color: var(--fg); font-weight: 600; }

/* indicador "en vivo" discreto junto a Audiovisual */
.nav-live {
  display: inline-block; margin-left: 6px; font-size: 9.5px; font-weight: 800; letter-spacing: .06em;
  color: var(--red); vertical-align: middle;
}

.nav { display: none; flex: 1; min-width: 0; }
@media (min-width: 1000px) { .nav { display: block; } }
.nav ul { display: flex; align-items: center; gap: 2px; }
.nav a {
  display: block; padding: 7px 10px; border-radius: var(--r-sm);
  font-size: var(--fs-sm); font-weight: 500; color: var(--fg-2);
  transition: color var(--t-fast), background var(--t-fast);
  white-space: nowrap;
}
.nav a:hover { color: var(--fg); background: var(--bg-3); }
.nav a.on { color: var(--fg); }
.nav a.on::after {
  content: ''; display: block; height: 2px; border-radius: 2px;
  background: var(--red); margin-top: 5px;
}

.hactions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.iconbtn {
  width: 38px; height: 38px; display: grid; place-items: center;
  border-radius: var(--r-sm); color: var(--fg-2);
  transition: background var(--t-fast), color var(--t-fast);
}
.iconbtn:hover { background: var(--bg-3); color: var(--fg); }
.iconbtn svg { width: 19px; height: 19px; }

.btn-live {
  display: none; align-items: center; gap: 8px;
  height: 38px; padding: 0 14px 0 12px; border-radius: var(--r-pill);
  background: var(--red); color: var(--on-red);
  font-size: var(--fs-sm); font-weight: 700; letter-spacing: .01em;
  transition: background var(--t-fast), transform var(--t-fast);
}
@media (min-width: 560px) { .btn-live { display: inline-flex; } }
.btn-live:hover { background: #ff6f6f; }
.btn-live:active { transform: scale(.98); }
.btn-live .eq { display: flex; align-items: flex-end; gap: 2px; height: 12px; }
.btn-live .eq i { width: 2px; background: var(--on-red); border-radius: 1px; animation: eq 900ms ease-in-out infinite; }
.btn-live .eq i:nth-child(1) { height: 6px;  animation-delay: 0ms; }
.btn-live .eq i:nth-child(2) { height: 12px; animation-delay: 160ms; }
.btn-live .eq i:nth-child(3) { height: 8px;  animation-delay: 320ms; }
@keyframes eq { 0%,100% { transform: scaleY(.45); } 50% { transform: scaleY(1); } }
@media (prefers-reduced-motion: reduce) { .btn-live .eq i { animation: none; } }

/* barra de categorías móvil */
.catbar { border-bottom: 1px solid var(--line); background: var(--bg); }
@media (min-width: 1000px) { .catbar { display: none; } }
.catbar-scroll { display: flex; gap: 6px; overflow-x: auto; padding: 8px var(--gutter); scrollbar-width: none; }
.catbar-scroll::-webkit-scrollbar { display: none; }
.catbar a {
  flex: 0 0 auto; padding: 7px 13px; border-radius: var(--r-pill);
  font-size: var(--fs-sm); font-weight: 500; color: var(--fg-2);
  background: var(--bg-3); border: 1px solid var(--line);
}
.catbar a.on { color: var(--fg); background: var(--red-soft); border-color: var(--red-line); }

/* buscador */
.search-overlay {
  position: fixed; inset: 0; z-index: 90; display: none;
  background: rgba(4, 5, 6, .72); backdrop-filter: blur(6px);
}
.search-overlay.open { display: block; }
.search-panel {
  max-width: 720px; margin: 8vh auto 0; background: var(--bg-2);
  border: 1px solid var(--line-2); border-radius: var(--r-lg);
  box-shadow: var(--shadow-2); overflow: hidden;
}
@media (max-width: 640px) { .search-panel { margin: 0; border-radius: 0; border: 0; height: 100%; } }
.search-field { display: flex; align-items: center; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
.search-field input {
  flex: 1; background: none; border: 0; color: var(--fg);
  font-family: var(--ff-ui); font-size: 1.0625rem; outline: none;
}
.search-field input::placeholder { color: var(--fg-3); }
.search-results { max-height: 58vh; overflow-y: auto; }
@media (max-width: 640px) { .search-results { max-height: calc(100% - 70px); } }
.search-results .sr-item { display: flex; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--line); }
.search-results .sr-item:hover { background: var(--bg-3); }
.search-results img { width: 72px; height: 48px; object-fit: cover; border-radius: var(--r-sm); flex: 0 0 auto; }
.search-results h4 { font-size: .9375rem; font-weight: 600; line-height: 1.3; }
.search-empty { padding: 28px 18px; color: var(--fg-3); font-size: var(--fs-sm); text-align: center; }

/* ------------------------------------------------------------- 4 · cards */
.kicker {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: var(--fs-kicker); font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: var(--red);
}
.kicker.muted { color: var(--fg-3); }
.kicker .dot { width: 4px; height: 4px; border-radius: 50%; background: currentColor; }

.meta { font-size: var(--fs-meta); color: var(--fg-3); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.meta .sep { width: 3px; height: 3px; border-radius: 50%; background: var(--line-2); }

.ph { position: relative; overflow: hidden; border-radius: var(--r); background: var(--bg-3); }
.ph img { width: 100%; height: 100%; object-fit: cover; object-position: center 45%; transition: transform 420ms cubic-bezier(.2,.7,.3,1); }
.ph.r-16-9 { aspect-ratio: 16 / 9; }
.ph.r-3-2  { aspect-ratio: 3 / 2; }
.ph.r-4-3  { aspect-ratio: 4 / 3; }
.ph.r-1-1  { aspect-ratio: 1 / 1; }
.ph.r-21-9 { aspect-ratio: 21 / 9; }
a:hover > .ph img, .card:hover .ph img { transform: scale(1.035); }

.card { display: block; }
.card h3 { transition: color var(--t-fast); }
.card:hover h3 { color: var(--red); }

/* hero principal */
.hero { display: grid; gap: 22px; }
@media (min-width: 900px) { .hero { grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); gap: 34px; align-items: start; } }

.hero-main .ph { border-radius: var(--r-lg); }
.hero-main .ph.tall { aspect-ratio: 16 / 9; }
@media (min-width: 900px) { .hero-main .ph.tall { aspect-ratio: 16 / 9; } }
.hero-main h2 {
  margin-top: 16px;
  text-wrap: balance;
  font-size: clamp(1.6rem, 1.05rem + 2.4vw, 2.9rem);
  line-height: 1.06; letter-spacing: -.028em; font-weight: 800;
}
.hero-main .dek {
  margin-top: 12px; color: var(--fg-2); font-size: clamp(.95rem, .9rem + .35vw, 1.1rem);
  line-height: 1.55; max-width: 38em;
}
.hero-main .meta { margin-top: 14px; }

.hero-side { display: grid; gap: 0; align-content: start; }
.hero-side .ad { margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--line); }
.hero-side .card { display: grid; grid-template-columns: 1fr 96px; gap: 14px; padding: 16px 0; border-top: 1px solid var(--line); align-items: start; }
.hero-side .card:first-child { border-top: 0; padding-top: 0; }
@media (min-width: 900px) { .hero-side .card:first-child { padding-top: 0; } }
.hero-side .card h3 { font-size: 1.02rem; font-weight: 600; line-height: 1.28; }
.hero-side .ph { border-radius: var(--r-sm); }
.hero-side .meta { margin-top: 8px; }

/* grilla de tarjetas */
.grid { display: grid; gap: 26px 22px; grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); }
.grid-2 { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.card-g h3 { margin-top: 12px; font-size: 1.06rem; font-weight: 600; line-height: 1.26; }
.card-g .dek { margin-top: 8px; color: var(--fg-2); font-size: var(--fs-sm); line-height: 1.5; }
.card-g .meta { margin-top: 10px; }
.card-g .kicker { margin-top: 12px; }

/* lista compacta (últimas) */
.list { display: grid; }
.list-item {
  display: grid; grid-template-columns: auto 1fr; gap: 12px;
  padding: 13px 0; border-top: 1px solid var(--line); align-items: baseline;
}
.list-item:first-child { border-top: 0; }
.list-item .hora { font-size: var(--fs-meta); font-weight: 700; color: var(--red); font-variant-numeric: tabular-nums; }
.list-item h4 { font-size: .9375rem; font-weight: 500; line-height: 1.35; color: var(--fg-2); transition: color var(--t-fast); }
.list-item:hover h4 { color: var(--fg); }
.list-item .cat { font-size: var(--fs-kicker); letter-spacing: .08em; text-transform: uppercase; color: var(--fg-3); margin-top: 4px; }

/* tira horizontal */
.strip { display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
.card-s h3 { margin-top: 10px; font-size: .95rem; font-weight: 600; line-height: 1.3; }
.card-s .meta { margin-top: 8px; }

/* card horizontal ancha */
.card-w { display: grid; grid-template-columns: 130px 1fr; gap: 16px; align-items: start; }
@media (min-width: 620px) { .card-w { grid-template-columns: 220px 1fr; gap: 20px; } }
.card-w h3 { font-size: 1.05rem; font-weight: 600; line-height: 1.28; margin-top: 10px; }
@media (min-width: 620px) { .card-w h3 { font-size: 1.22rem; margin-top: 12px; } }
.card-w .dek { margin-top: 8px; color: var(--fg-2); font-size: var(--fs-sm); line-height: 1.5; display: none; }
@media (min-width: 620px) { .card-w .dek { display: block; } }
.card-w .meta { margin-top: 10px; }

/* ------------------------------------------------ 5 · títulos de sección */
.sec-head {
  display: flex; align-items: flex-end; gap: 14px;
  padding-bottom: 12px; border-bottom: 2px solid var(--line-2); margin-bottom: 22px;
}
.sec-head h2 {
  font-size: 1.22rem; font-weight: 700; letter-spacing: -.01em;
  display: flex; align-items: center; gap: 10px;
}
.sec-head h2::before { content: ''; width: 4px; height: 19px; border-radius: 2px; background: var(--acc, var(--red)); }
.sec-head .more { margin-left: auto; font-size: var(--fs-meta); font-weight: 600; color: var(--fg-3); display: inline-flex; align-items: center; gap: 5px; }
.sec-head .more:hover { color: var(--red); }

/* ---------------------------------------------------------- 6 · anuncios */
.ad { --ad-tone: var(--line-2); display: block; }
.ad-label {
  font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--fg-3); margin-bottom: 6px; display: flex; align-items: center; gap: 6px;
}
.ad-label b { color: var(--line-2); font-weight: 700; }
.ad-box {
  position: relative; overflow: hidden;
  border: 1px solid var(--line); border-radius: var(--r);
  background-color: var(--bg-3);
  background-size: cover; background-position: 50% 40%;
  display: flex; flex-direction: column; justify-content: flex-end;
  transition: border-color var(--t-fast);
}
.ad:hover .ad-box { border-color: var(--line-2); }
.ad-box::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--ad-tone); z-index: 2;
}
.ad-scrim {
  position: absolute; inset: 0;
  background: linear-gradient(0deg, rgba(9,10,12,.92) 0%, rgba(9,10,12,.72) 42%, rgba(9,10,12,.18) 78%, rgba(9,10,12,.05) 100%);
}
.ad-content { position: relative; z-index: 1; padding: 16px 18px; }
.ad-brand { font-weight: 700; font-size: 1rem; letter-spacing: -.01em; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.4); }
.ad-claim { color: rgba(255,255,255,.86); font-size: var(--fs-sm); margin-top: 4px; line-height: 1.4; }
.ad-cta { margin-top: 10px; font-size: var(--fs-meta); font-weight: 700; color: #fff; }

.ad--leaderboard .ad-box { min-height: 100px; background-position: 50% 30%; }
@media (min-width: 760px) {
  .ad--leaderboard .ad-box { min-height: 90px; }
  .ad--leaderboard .ad-scrim { background: linear-gradient(90deg, rgba(9,10,12,.94) 0%, rgba(9,10,12,.78) 46%, rgba(9,10,12,.2) 82%, rgba(9,10,12,.05) 100%); }
  .ad--leaderboard .ad-content { display: flex; align-items: center; gap: 20px; width: 100%; padding: 14px 20px; }
  .ad--leaderboard .ad-claim { margin-top: 0; }
  .ad--leaderboard .ad-cta { margin-top: 0; margin-left: auto; flex: 0 0 auto; }
}
.ad--rectangle .ad-box { min-height: 250px; }
.ad--sidebar   .ad-box { min-height: 480px; }
.ad--infeed    .ad-box { min-height: 150px; }
.ad--article   .ad-box { min-height: 150px; }

.ad--infeed { grid-column: 1 / -1; }
@media (min-width: 620px) { .ad--infeed { grid-column: span 1; } }

.tone-rojo  { --ad-tone: #FF5656; }
.tone-verde { --ad-tone: #7FB33C; }
.tone-ambar { --ad-tone: #E3A43B; }
.tone-azul  { --ad-tone: #45A3C6; }
.tone-gris  { --ad-tone: #8892A0; }

/* --------------------------------------------------- 7 · reproductor 📻 */
.player {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 80;
  background: var(--bg-glass);
  backdrop-filter: saturate(160%) blur(18px);
  -webkit-backdrop-filter: saturate(160%) blur(18px);
  border-top: 1px solid var(--line-2);
  box-shadow: 0 -12px 34px rgba(0,0,0,.42);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.player-in {
  display: grid; align-items: center; gap: 12px;
  grid-template-columns: auto minmax(0, 1fr) auto;
  height: var(--player-h);
}

.pl-play {
  width: 46px; height: 46px; border-radius: 50%;
  background: var(--red); color: var(--on-red);
  display: grid; place-items: center; flex: 0 0 auto;
  transition: transform var(--t-fast), background var(--t-fast), box-shadow var(--t);
  box-shadow: 0 0 0 0 rgba(255,86,86,.45);
}
@media (min-width: 700px) { .pl-play { width: 50px; height: 50px; } }
.pl-play:hover { background: #ff6f6f; }

/* ===== src/core/utils.js ===== */
/* ============================================================================
   CORE · Utilidades genéricas (agnósticas de RO)
   ========================================================================== */

const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio',
  'agosto', 'setiembre', 'octubre', 'noviembre', 'diciembre'];
const DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];

/** Escapa texto para inyección segura en HTML. */
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

/** "11 set · 08:10" */
function fechaCorta(iso) {
  const d = new Date(iso);
  const mes = MESES[d.getMonth()].slice(0, 3);
  return `${d.getDate()} ${mes} · ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

/** "Viernes 11 de setiembre de 2026, 08:10" */
function fechaLarga(iso) {
  const d = new Date(iso);
  const dia = DIAS[d.getDay()];
  return `${dia.charAt(0).toUpperCase() + dia.slice(1)} ${d.getDate()} de ${MESES[d.getMonth()]} de ${d.getFullYear()}, ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

/** "hace 12 min" / "hace 3 h" / "ayer" / fecha */
function haceRato(iso, ahora) {
  const d = new Date(iso).getTime();
  const min = Math.round(((ahora || Date.now()) - d) / 60000);
  if (min < 1) return 'ahora';
  if (min < 60) return `hace ${min} min`;
  const h = Math.round(min / 60);
  if (h < 24) return `hace ${h} h`;
  const dias = Math.round(h / 24);
  if (dias === 1) return 'ayer';
  if (dias < 7) return `hace ${dias} días`;
  return fechaCorta(iso);
}

function pad(n) { return n < 10 ? '0' + n : '' + n; }

function mmss(seg) {
  if (!isFinite(seg) || seg < 0) seg = 0;
  return Math.floor(seg / 60) + ':' + pad(Math.floor(seg % 60));
}

/** Minutos de lectura estimados a partir de los bloques del cuerpo. */
function tiempoLectura(body) {
  const palabras = body.reduce((acc, b) => {
    const t = Array.isArray(b) ? (b[1] || '') : b;
    return acc + String(t).split(/\s+/).length;
  }, 0);
  return Math.max(1, Math.round(palabras / 160));
}

/** Normaliza para búsqueda: minúsculas sin acentos. */
function norm(s) {
  return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

/** Barajado determinístico por semilla (para publicidad estable). */
function pick(arr, seed) { return arr[Math.abs(seed) % arr.length]; }

function debounce(fn, ms) {
  let t;
  return function () { clearTimeout(t); const a = arguments; t = setTimeout(() => fn.apply(null, a), ms); };
}


/* ===== src/core/store.js ===== */
/* ============================================================================
   CORE · Store — índices derivados del contenido.
   Única capa que conoce la forma de los datos; las vistas consultan acá.
   Mañana esto se reemplaza por la API de WordPress sin tocar las vistas.
   ========================================================================== */

const Store = (function () {
  const items = [].concat(NEWS_A, NEWS_B).map((n, i) => Object.assign({}, n, {
    img: 'img/' + n.slug + '.jpg',
    ts: n.ts,
    _t: new Date(n.ts).getTime(),
    orden: i,
    lectura: tiempoLectura(n.body),
  }));

  items.sort((a, b) => b._t - a._t);

  const porSlug = {};
  items.forEach((n) => { porSlug[n.slug] = n; });

  const catBySlug = {};
  RO_CONFIG.CATEGORIAS.forEach((c) => { catBySlug[c.slug] = c; });

  function cat(slug) { return catBySlug[slug] || { slug: slug, nombre: slug, color: '#FF5656', desc: '' }; }

  function porCategoria(slug, limite) {
    const r = items.filter((n) => n.cat === slug);
    return limite ? r.slice(0, limite) : r;
  }

  /** Destacadas globales, ordenadas por peso editorial y luego por fecha. */
  function destacadas(limite) {
    const r = items.slice().sort((a, b) => (a.dest - b.dest) || (b._t - a._t));
    return limite ? r.slice(0, limite) : r;
  }

  function ultimas(limite, excluir) {
    const ex = new Set(excluir || []);
    return items.filter((n) => !ex.has(n.id)).slice(0, limite || 10);
  }

  function relacionadas(nota, limite) {
    const mismaCat = items.filter((n) => n.cat === nota.cat && n.id !== nota.id);
    const resto = items.filter((n) => n.cat !== nota.cat && n.id !== nota.id);
    return mismaCat.concat(resto).slice(0, limite || 4);
  }

  function buscar(q) {
    const t = norm(q).trim();
    if (t.length < 2) return [];
    const term = t.split(/\s+/);
    return items
      .map((n) => {
        const hay = norm(n.t + ' ' + n.d + ' ' + (n.tags || []).join(' ') + ' ' + cat(n.cat).nombre);
        let score = 0;
        term.forEach((w) => {
          if (norm(n.t).includes(w)) score += 3;
          else if (hay.includes(w)) score += 1;
        });
        return { n: n, score: score };
      })
      .filter((r) => r.score > 0)
      .sort((a, b) => b.score - a.score || b.n._t - a.n._t)
      .map((r) => r.n)
      .slice(0, 40);
  }

  function conAudio(limite) {
    return items.filter((n) => n.audio).slice(0, limite || 4);
  }

  return {
    items: items, porSlug: porSlug, cat: cat, categorias: RO_CONFIG.CATEGORIAS,
    porCategoria: porCategoria, destacadas: destacadas, ultimas: ultimas,
    relacionadas: relacionadas, buscar: buscar, conAudio: conAudio,
  };
})();


/* ===== src/core/media-coordinator.js ===== */
/* ============================================================================
   CORE · MediaCoordinator
   ----------------------------------------------------------------------------
   Único árbitro de "quién suena". Radio, AudioNota y YouTubeFacade se
   registran acá en vez de conocerse entre sí. Cuando una fuente empieza a
   sonar, se pausan todas las demás. Ninguna fuente reanuda sonido sola: eso
   siempre requiere una acción explícita del usuario.
   Pensado para reutilizarse tal cual en cualquier medio de 2248 Media Systems.
   ========================================================================== */
const MediaCoordinator = (function () {
  const fuentes = {};

  /** @param {string} id  @param {{pausar:Function}} handlers */
  function registrar(id, handlers) { fuentes[id] = handlers; }

  /** Avisa que `id` empezó a sonar: pausa cualquier otra fuente activa. */
  function notificar(id) {
    Object.keys(fuentes).forEach((k) => {
      if (k !== id && fuentes[k] && fuentes[k].pausar) fuentes[k].pausar();
    });
    APP.emit('media', { activa: id });
  }

  return { registrar: registrar, notificar: notificar };
})();


/* ===== src/core/live-window.js ===== */
/* ============================================================================
   CORE · Ventana de prioridad audiovisual
   ----------------------------------------------------------------------------
   Determina si el horario actual en Uruguay (America/Montevideo, NUNCA la
   zona horaria del dispositivo) cae dentro de la franja del informativo en
   vivo. `?demoLive=1` fuerza el estado LIVE para poder mostrarle al cliente
   cómo se ve la portada en esa franja, sin exponer un botón visible.
   ========================================================================== */
const AudiovisualLive = (function () {
  function horaMontevideo(tz) {
    const fmt = new Intl.DateTimeFormat('en-GB', {
      timeZone: tz, hour: '2-digit', minute: '2-digit', hour12: false,
    });
    return fmt.format(new Date());   // hora real del visitante, no APP.ahora (fecha fija de la demo)
  }

  function aMinutos(hhmm) {
    const p = hhmm.split(':');
    return (+p[0]) * 60 + (+p[1]);
  }

  function demoForzado() {
    try { return /(?:^|[?&])demoLive=1(?:&|$)/.test(location.search); } catch (e) { return false; }
  }

  function estaEnVivo() {
    if (demoForzado()) return true;
    const cfg = RO_CONFIG.AUDIOVISUAL;
    const actual = aMinutos(horaMontevideo(cfg.timezone));
    return actual >= aMinutos(cfg.priorityStart) && actual <= aMinutos(cfg.priorityEnd);
  }

  return { estaEnVivo: estaEnVivo, demoForzado: demoForzado };
})();

/* ============================================================================
   CORE · Identidad visual de marca (RO Contenidos + emisoras)
   ----------------------------------------------------------------------------
   Los tres logos de radio tienen proporciones distintas entre sí, y distintas
   de la del isologo de RO. Este componente normaliza el contenedor sin
   deformar ni recortar la imagen: siempre `object-fit: contain`.
   Reutilizable para cualquier medio de 2248 Media Systems.
   ========================================================================== */

/**
 * @param {{logo:string,nombre:string}} entidad  objeto con `logo` (ruta relativa a /public) y `nombre`
 * @param {{size?:number, variant?:'default'|'mono', className?:string}} [opts]
 */
function StationLogo(entidad, opts) {
  opts = opts || {};
  const size = opts.size || 32;
  const cls = 'station-logo' + (opts.variant === 'mono' ? ' station-logo--mono' : '') + (opts.className ? ' ' + opts.className : '');
  if (!entidad || !entidad.logo) return '';
  return (
    '<span class="' + cls + '" style="--sl-size:' + size + 'px">' +
      '<img src="' + esc(entidad.logo) + '" alt="' + esc(entidad.nombre || '') + '" loading="lazy" decoding="async">' +
    '</span>'
  );
}

/** Isologo de RO Contenidos (imagen real), para header / footer / institucional. */
function BrandLogo(alto) {
  const s = RO_CONFIG.SITE;
  return (
    '<span class="brand-logo" style="--bl-h:' + (alto || 34) + 'px">' +
      '<img src="' + esc(s.logo) + '" alt="' + esc(s.nombre) + '" decoding="async">' +
    '</span>'
  );
}


/* ===== src/components/ads.js ===== */
/* ============================================================================
   CORE · Publicidad
   ----------------------------------------------------------------------------
   Un único componente para los cinco formatos. Cada slot reserva su altura
   desde CSS, de modo que el anuncio nunca desplaza el contenido al cargar
   (cero CLS) ni se superpone al reproductor.
   En producción el cuerpo del <div class="ad-box"> se reemplaza por el tag
   del ad server; el contenedor, la etiqueta y las medidas ya quedan resueltos.
   ========================================================================== */

/**
 * @param {'leaderboard'|'rectangle'|'sidebar'|'infeed'|'article'} formato
 * @param {number} seed  índice estable para elegir anunciante sin repetir
 */
let _adTurno = 0;
function resetAds() { _adTurno = 0; }

function Ad(formato, seed) {
  const cfg = RO_CONFIG.PUBLICIDAD;
  // rotación secuencial: nunca se repite un anunciante hasta agotar la lista,
  // así no aparecen dos avisos iguales en la misma pantalla.
  const a = cfg.anunciantes[(_adTurno++) % cfg.anunciantes.length];
  const medida = {
    leaderboard: '970×90',
    rectangle: '300×250',
    sidebar: '300×600',
    infeed: 'In-feed',
    article: 'In-article',
  }[formato];

  return (
    '<a class="ad ad--' + formato + ' tone-' + a.tono + '" href="#/publicidad" data-ad="' + esc(a.id) + '">' +
      '<div class="ad-label">' + esc(cfg.etiqueta) + ' <b>·</b> ' + esc(medida) + ' <b>·</b> ' + esc(cfg.nota) + '</div>' +
      '<div class="ad-box" style="background-image:url(' + esc(a.img) + ')">' +
        '<div class="ad-scrim"></div>' +
        '<div class="ad-content">' +
          '<div class="ad-brand">' + esc(a.marca) + '</div>' +
          '<div class="ad-claim">' + esc(a.claim) + '</div>' +
          '<div class="ad-cta">' + esc(a.cta || 'Ver más') + ' →</div>' +
        '</div>' +
      '</div>' +
    '</a>'
  );
}

/** Inserta anuncios in-feed cada `cada` tarjetas dentro de una grilla. */
function intercalarAds(cards, cada, seedBase) {
  const out = [];
  cards.forEach((html, i) => {
    out.push(html);
    if ((i + 1) % cada === 0 && i !== cards.length - 1) {
      out.push(Ad('infeed', seedBase + i));
    }
  });
  return out.join('');
}

/* ===== src/components/youtube-facade.js ===== */
/* ============================================================================
   CORE · YouTubeFacade
   ----------------------------------------------------------------------------
   No carga el iframe de YouTube hasta que el usuario presiona Play (patrón
   "facade"): al inicio sólo hay una miniatura + botón. Evita cargar el JS
   pesado de YouTube en cada visita a Audiovisual o a la portada en vivo.
   Se coordina con MediaCoordinator: al reproducir, pausa radio y audio de
   nota; si el usuario inicia otra fuente, el video se detiene (se vuelve a
   la miniatura, no queda un iframe sonando de fondo).
   ========================================================================== */
const YouTubeFacade = (function () {
  function thumb(videoId) { return 'https://i.ytimg.com/vi/' + videoId + '/hqdefault.jpg'; }

  function facadeInner(video) {
    return (
      '<div class="yt-thumb" style="background-image:url(' + esc(thumb(video.videoId)) + ')">' +
        '<button class="yt-play" aria-label="Reproducir ' + esc(video.titulo || 'video') + '">' + ICON.play + '</button>' +
      '</div>'
    );
  }

  /**
   * @param {{videoId:string, titulo?:string}} video
   * @param {{className?:string}} [opts]
   */
  function render(video, opts) {
    opts = opts || {};
    if (!video || !video.videoId) return '';
    return (
      '<div class="yt-facade' + (opts.className ? ' ' + opts.className : '') + '" ' +
        'data-yt-id="' + esc(video.videoId) + '" data-yt-title="' + esc(video.titulo || '') + '">' +
        facadeInner(video) +
      '</div>'
    );
  }

  function reproducir(el) {
    const id = el.getAttribute('data-yt-id');
    const titulo = el.getAttribute('data-yt-title') || 'Video';
    MediaCoordinator.notificar('youtube');
    el.classList.add('playing');
    el.innerHTML =
      '<iframe src="https://www.youtube-nocookie.com/embed/' + esc(id) + '?autoplay=1&rel=0" ' +
      'title="' + esc(titulo) + '" loading="lazy" allowfullscreen ' +
      'allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>';
  }

  function pausarTodas() {
    document.querySelectorAll('.yt-facade.playing').forEach((el) => {
      const id = el.getAttribute('data-yt-id');
      const titulo = el.getAttribute('data-yt-title');
      el.classList.remove('playing');
      el.innerHTML = facadeInner({ videoId: id, titulo: titulo });
    });
  }

  function activar(scope) {
    scope.querySelectorAll('[data-yt-id]').forEach((el) => {
      el.addEventListener('click', () => { if (!el.classList.contains('playing')) reproducir(el); });
    });
  }

  MediaCoordinator.registrar('youtube', { pausar: pausarTodas });

  return { render: render, activar: activar, pausarTodas: pausarTodas };
})();

/* ===== src/components/player.js ===== */
/* ============================================================================
   CORE · Reproductor persistente
   ----------------------------------------------------------------------------
   Vive FUERA del contenedor de vistas (#view). El router nunca lo toca, así que
   el elemento <audio> jamás se desmonta: el audio sobrevive a toda la
   navegación interna (home → nota → categoría → nota → home).
   ========================================================================== */

const Radio = (function () {
  const emisoras = RO_CONFIG.RADIOS;
  let audio = null;
  let idx = 0;
  let sonando = false;
  let cargando = false;
  let vol = 0.8;
  let root = null;

  /* ------------------------------------------------------- persistencia */
  function guardar() {
    try {
      localStorage.setItem('ro.player', JSON.stringify({ e: emisoras[idx].id, v: vol }));
    } catch (e) { /* modo privado: se ignora */ }
  }
  function recuperar() {
    try {
      const s = JSON.parse(localStorage.getItem('ro.player') || '{}');
      if (s.v != null && isFinite(s.v)) vol = Math.min(1, Math.max(0, s.v));
      const i = emisoras.findIndex((r) => r.id === s.e);
      if (i >= 0) idx = i;
    } catch (e) { /* sin storage: valores por defecto */ }
  }

  /* -------------------------------------------------------------- markup */
  function render() {
    const r = emisoras[idx];
    return (
      '<div class="wrap">' +
        '<div class="player-err">No se pudo iniciar la transmisión. Probá de nuevo o elegí otra emisora.</div>' +
        '<div class="player-in">' +
          '<button class="pl-play" data-pl="toggle" aria-label="Reproducir">' + ICON.play + '</button>' +
          '<div class="pl-info">' +
            '<div class="pl-line1">' +
              StationLogo(r, { size: 22, className: 'pl-logo' }) +
              '<span class="live-pill" data-pl="live"><i></i>En vivo</span>' +
              '<span class="pl-name" data-pl="name">' + esc(r.nombre) + '</span>' +
            '</div>' +
            '<div class="pl-prog" data-pl="prog"><b>' + esc(r.dial) + ' · </b>' + esc(r.programa.titulo) + ' · ' + esc(r.programa.horario) + '</div>' +
          '</div>' +
          '<div class="pl-right">' +
            '<div class="pl-wave" aria-hidden="true"><i></i><i></i><i></i><i></i></div>' +
            '<div class="pl-vol">' +
              '<button class="iconbtn" data-pl="mute" aria-label="Silenciar">' + ICON.vol + '</button>' +
              '<input type="range" min="0" max="100" value="' + Math.round(vol * 100) + '" data-pl="vol" aria-label="Volumen">' +
            '</div>' +
            '<div class="pl-stations">' +
              '<button class="pl-stbtn" data-pl="menu" aria-haspopup="true" aria-expanded="false">' +
                ICON.radio + '<span class="lbl">Emisoras</span>' + ICON.chevUp +
              '</button>' +
              '<div class="pl-menu" data-pl="menubox" role="menu">' +
                '<h5>Elegí una emisora</h5>' +
                emisoras.map((e, i) =>
                  '<button role="menuitem" data-pl="st" data-i="' + i + '" class="' + (i === idx ? 'on' : '') + '">' +
                    StationLogo(e, { size: 28, className: 'st-logo' }) +
                    '<span><span class="st-n">' + esc(e.nombre) + '</span> ' +
                    '<span class="st-d">· ' + esc(e.dial) + '</span>' +
                    '<div class="st-d">' + esc(e.programa.titulo) + '</div></span>' +
                  '</button>').join('') +
              '</div>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }

  /* --------------------------------------------------------------- lógica */
  function sync() {
    const r = emisoras[idx];
    root.classList.toggle('playing', sonando);
    root.classList.toggle('loading', cargando);
    const btn = root.querySelector('[data-pl=toggle]');
    btn.innerHTML = sonando ? ICON.pause : ICON.play;
    btn.setAttribute('aria-label', sonando ? 'Pausar' : 'Reproducir');
    root.querySelector('[data-pl=name]').textContent = r.nombre;
    const plLogo = root.querySelector('.pl-logo img');
    if (plLogo) { plLogo.src = r.logo; plLogo.alt = r.nombre; }
    root.querySelector('[data-pl=prog]').innerHTML = '<b>' + esc(r.dial) + ' · </b>' + esc(r.programa.titulo) + ' · ' + esc(r.programa.horario);
    root.querySelectorAll('[data-pl=st]').forEach((b, i) => b.classList.toggle('on', i === idx));
    const slider = root.querySelector('[data-pl=vol]');
    slider.value = Math.round(vol * 100);
    slider.style.setProperty('--fill', Math.round(vol * 100) + '%');
    root.querySelector('[data-pl=mute]').innerHTML = vol === 0 ? ICON.mute : ICON.vol;
    document.querySelectorAll('[data-radio-state]').forEach(actualizarBotonExterno);
    APP.emit('radio', { emisora: r, sonando: sonando });
  }

  function actualizarBotonExterno(el) {
    const id = el.getAttribute('data-radio-state');
    const activa = sonando && emisoras[idx].id === id;
    el.classList.toggle('on', activa);
    const card = el.closest('.radio-card');
    if (card) card.classList.toggle('on', activa);
    const lbl = el.querySelector('[data-lbl]');
    if (lbl) lbl.textContent = activa ? 'Pausar' : 'Escuchar en vivo';
    const ic = el.querySelector('[data-ic]');
    if (ic) ic.innerHTML = activa ? ICON.pause : ICON.play;
  }

  function cargar() {
    const r = emisoras[idx];
    if (audio.getAttribute('data-src') !== r.streamUrl) {
      audio.src = r.streamUrl;
      audio.setAttribute('data-src', r.streamUrl);
      audio.loop = true; // demo local: la pista se repite para simular continuidad
    }
  }

  function play() {
    cargar();
    cargando = true; root.classList.remove('err'); sync();
    const p = audio.play();
    if (p && p.catch) {
      p.then(() => { cargando = false; sonando = true; sync(); })
       .catch(() => { cargando = false; sonando = false; root.classList.add('err'); sync(); });
    } else { cargando = false; sonando = true; sync(); }
    MediaCoordinator.notificar('radio');
  }

  function pause() { audio.pause(); sonando = false; cargando = false; sync(); }
  function toggle() { sonando ? pause() : play(); }

  function elegir(i, autoplay) {
    if (i === idx) { if (autoplay) toggle(); return; }
    idx = i; guardar();
    if (sonando || autoplay) { play(); } else { cargar(); sync(); }
    if (!sonando && !autoplay) sync();
  }

  /* ------------------------------------------------------------- montaje */
  function montar(el) {
    root = el;
    recuperar();
    root.className = 'player';
    root.innerHTML = render();

    audio = document.createElement('audio');
    audio.preload = 'none';
    audio.volume = vol;
    root.appendChild(audio);
    audio.addEventListener('playing', () => { cargando = false; sonando = true; sync(); });
    audio.addEventListener('pause', () => { sonando = false; sync(); });
    audio.addEventListener('error', () => { cargando = false; sonando = false; root.classList.add('err'); sync(); });
    MediaCoordinator.registrar('radio', { pausar: () => { if (sonando) pause(); } });

    root.addEventListener('click', (ev) => {
      const b = ev.target.closest('[data-pl]');
      if (!b) return;
      const k = b.getAttribute('data-pl');
      if (k === 'toggle') toggle();
      else if (k === 'menu') {
        const box = root.querySelector('[data-pl=menubox]');
        const abierto = box.classList.toggle('open');
        b.setAttribute('aria-expanded', abierto ? 'true' : 'false');
      } else if (k === 'st') {
        elegir(+b.getAttribute('data-i'), true);
        root.querySelector('[data-pl=menubox]').classList.remove('open');
      } else if (k === 'mute') {
        vol = vol === 0 ? 0.8 : 0;
        audio.volume = vol; guardar(); sync();
      }
    });

    root.addEventListener('input', (ev) => {
      if (ev.target.getAttribute('data-pl') !== 'vol') return;
      vol = ev.target.value / 100;
      audio.volume = vol; guardar(); sync();
    });

    document.addEventListener('click', (ev) => {
      if (!ev.target.closest('.pl-stations')) {
        const box = root.querySelector('[data-pl=menubox]');
        if (box) box.classList.remove('open');
      }
    });

    document.addEventListener('keydown', (ev) => {
      if (ev.key === 'Escape') root.querySelector('[data-pl=menubox]').classList.remove('open');
      // barra espaciadora: play/pausa si no se está escribiendo
      if (ev.code === 'Space' && !/^(INPUT|TEXTAREA|BUTTON)$/.test(document.activeElement.tagName)) {
        ev.preventDefault(); toggle();
      }
    });

    sync();
  }

  return {
    montar: montar,
    toggle: toggle,
    play: play,
    pause: pause,
    elegir: elegir,
    pausar: () => { if (sonando) pause(); },
    estado: () => ({ emisora: emisoras[idx], sonando: sonando }),
    indice: () => idx,
  };
})();

/* ============================================================================
   CORE · Audio de la nota (entrevistas / audios editoriales)
   Se diferencia visualmente del stream en vivo y nunca suena encima de él.
   ========================================================================== */
const AudioNota = (function () {
  const vivos = [];

  function render(nota) {
    if (!nota.audio) return '';
    return (
      '<div class="aud" data-aud="' + esc(nota.audio.src) + '">' +
        '<div class="aud-top">' +
          '<button class="aud-btn" data-an="toggle" aria-label="Reproducir audio de la nota">' + ICON.play + '</button>' +
          '<div class="aud-meta">' +
            '<div class="aud-tag"><span class="ic">' + ICON.mic + '</span> Audio de la nota · Grabado</div>' +
            '<div class="aud-name">' + esc(nota.audio.titulo) + '</div>' +
          '</div>' +
          '<div class="aud-time" data-an="time">0:00 / ' + esc(nota.audio.duracion) + '</div>' +
        '</div>' +
        '<div class="aud-bar" data-an="bar"><div class="aud-fill" data-an="fill"></div></div>' +
      '</div>'
    );
  }

  function activar(scope) {
    vivos.length = 0;
    scope.querySelectorAll('[data-aud]').forEach((box) => {
      const el = document.createElement('audio');
      el.preload = 'metadata';
      el.src = box.getAttribute('data-aud');
      box.appendChild(el);
      vivos.push({ box: box, el: el });

      const btn = box.querySelector('[data-an=toggle]');
      const fill = box.querySelector('[data-an=fill]');
      const time = box.querySelector('[data-an=time]');
      const bar = box.querySelector('[data-an=bar]');

      btn.addEventListener('click', () => {
        if (el.paused) {
          MediaCoordinator.notificar('nota');   // el audio grabado no compite con otras fuentes
          el.play();
        } else { el.pause(); }
      });
      el.addEventListener('play', () => { box.classList.add('playing'); btn.innerHTML = ICON.pause; });
      el.addEventListener('pause', () => { box.classList.remove('playing'); btn.innerHTML = ICON.play; });
      el.addEventListener('timeupdate', () => {
        const d = el.duration || 1;
        fill.style.width = (el.currentTime / d * 100) + '%';
        time.textContent = mmss(el.currentTime) + ' / ' + mmss(d);
      });
      el.addEventListener('loadedmetadata', () => {
        time.textContent = '0:00 / ' + mmss(el.duration);
      });
      bar.addEventListener('click', (ev) => {
        const r = bar.getBoundingClientRect();
        el.currentTime = ((ev.clientX - r.left) / r.width) * (el.duration || 0);
      });
    });
  }

  function pausarTodo() { vivos.forEach((v) => { if (!v.el.paused) v.el.pause(); }); }

  MediaCoordinator.registrar('nota', { pausar: pausarTodo });

  return { render: render, activar: activar, pausarTodo: pausarTodo };
})();

      '</div></footer>'

  /* ---------------------------------------------------- comportamiento */
  function activarBuscador() {
    const ov = document.querySelector('[data-search=overlay]');
    const input = ov.querySelector('[data-search=input]');
    const res = ov.querySelector('[data-search=results]');

    function abrir() { ov.classList.add('open'); setTimeout(() => input.focus(), 30); }
    function cerrar() { ov.classList.remove('open'); input.value = ''; pintar(''); }

    function pintar(q) {
      const r = Store.buscar(q);
      if (!q || q.trim().length < 2) {
        res.innerHTML = '<div class="search-empty">Escribí al menos dos letras para buscar.</div>';
        return;
      }
      if (!r.length) {
        res.innerHTML = '<div class="search-empty">Sin resultados para “' + esc(q) + '”.</div>';
        return;
      }
      res.innerHTML = r.slice(0, 12).map((n) =>
        '<a class="sr-item" href="' + href(n) + '" data-search="go">' +
          '<img src="' + esc(n.img) + '" alt="" loading="lazy">' +

        '</a>').join('') +
        (r.length > 12 ? '<div class="search-empty">+' + (r.length - 12) + ' resultados más</div>' : '');
    }

    input.addEventListener('input', debounce(() => pintar(input.value), 120));
    ov.addEventListener('click', (ev) => {
      if (ev.target === ov || ev.target.closest('[data-search=close]')) cerrar();
      if (ev.target.closest('[data-search=go]')) cerrar();
    });
    document.addEventListener('keydown', (ev) => {
      if (ev.key === 'Escape') cerrar();
      if ((ev.key === '/' || (ev.key === 'k' && (ev.metaKey || ev.ctrlKey))) &&
          !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) {
        ev.preventDefault(); abrir();
      }
    });
    document.addEventListener('click', (ev) => {
      if (ev.target.closest('[data-act=search]')) abrir();
    });
  }

  /** Marca la sección activa en ambas navegaciones. */
  function marcarNav(clave) {
    document.querySelectorAll('[data-nav]').forEach((a) => {
      a.classList.toggle('on', a.getAttribute('data-nav') === clave);
    });
  }

  /** Menú "Más" del header de escritorio: abre/cierra con clic y Escape. */
  function activarNavMas() {
    document.addEventListener('click', (ev) => {
      const btn = ev.target.closest('[data-nav-more]');
      const dentro = ev.target.closest('.nav-more');
      const menu = document.querySelector('[data-nav-more-menu]');
      if (!menu) return;
      if (btn) {
        const abierto = menu.classList.toggle('open');
        btn.setAttribute('aria-expanded', abierto ? 'true' : 'false');
      } else if (!dentro) {
        menu.classList.remove('open');
        const b = document.querySelector('[data-nav-more]');
        if (b) b.setAttribute('aria-expanded', 'false');
      }
    });
    document.addEventListener('keydown', (ev) => {
      if (ev.key !== 'Escape') return;
      const menu = document.querySelector('[data-nav-more-menu]');
      if (menu) menu.classList.remove('open');
    });
  }

  return {
    topbar: topbar, header: header, footer: footer, buscador: buscador,
    demoBanner: demoBanner, activarBuscador: activarBuscador, marcarNav: marcarNav,
    activarNavMas: activarNavMas,
  };
})();

   Columna de lectura acotada (~44rem) para líneas de 65-75 caracteres.

function bloqueCuerpo(b, nota, i) {
  if (typeof b === 'string') return '<p>' + esc(b) + '</p>';
  const k = b[0];
  if (k === 'h') return '<h2>' + esc(b[1]) + '</h2>';
  if (k === 'q') {
    return '<blockquote><p>“' + esc(b[1]) + '”</p>' +
      (b[2] ? '<cite>— ' + esc(b[2]) + '</cite>' : '') + '</blockquote>';
  }
  if (k === 'img') {
    return '<figure class="art-figure" style="margin:30px 0">' +
      '<div class="ph r-16-9"><img src="img/' + esc(b[1]) + '.jpg" alt="" loading="lazy"></div>' +
      (b[2] ? '<figcaption>' + esc(b[2]) + '</figcaption>' : '') + '</figure>';
  }
  return '';
}

function ViewNota(slug) {
  const n = Store.porSlug[slug];
  if (!n) return ViewNotFound();

  const c = Store.cat(n.cat);
  const rel = Store.relacionadas(n, 4);
  const mas = Store.ultimas(6, [n.id].concat(rel.map((x) => x.id)));
  const iniciales = n.a.split(' ').map((w) => w[0]).join('').slice(0, 2).toUpperCase();

  /* La publicidad in-article entra después del 3er párrafo: ya hay lectura

/* ===== src/core/router.js ===== */
/* ============================================================================
   CORE · Router de hash
   ----------------------------------------------------------------------------
   Sólo reemplaza el contenido de #view. La cabecera y el reproductor quedan
   intactos, por eso el audio nunca se interrumpe.
   Gestión de scroll:
     · navegación hacia adelante (clic en un enlace) → la vista arranca arriba;
     · atrás / adelante del navegador → se restaura la posición de lectura.
   ========================================================================== */

const Router = (function () {
  const posiciones = {};
  let actual = null;
  let navegacionPropia = false;

  function parse(hash) {
    const h = (hash || location.hash || '#/').replace(/^#/, '');
    const p = h.split('/').filter(Boolean);
    if (!p.length) return { vista: 'home' };
    if (p[0] === 'c') return { vista: 'categoria', slug: decodeURIComponent(p[1] || '') };
    if (p[0] === 'n') return { vista: 'nota', slug: decodeURIComponent(p[1] || '') };
    if (p[0] === 'radios') return { vista: 'radios' };
    if (p[0] === 'audiovisual') return { vista: 'audiovisual' };
    if (p[0] === 'publicidad') return { vista: 'publicidad' };
    if (p[0] === 'contacto') return { vista: 'contacto' };
    return { vista: '404' };
  }

  function titulo(r) {
    const s = RO_CONFIG.SITE.nombre;
    if (r.vista === 'home') return s + ' · ' + RO_CONFIG.SITE.tagline;
    if (r.vista === 'categoria') return Store.cat(r.slug).nombre + ' · ' + s;
    if (r.vista === 'nota') return (Store.porSlug[r.slug] ? Store.porSlug[r.slug].t : 'Nota') + ' · ' + s;
    if (r.vista === 'radios') return 'Radios en vivo · ' + s;
    if (r.vista === 'audiovisual') return 'Audiovisual · ' + s;
    if (r.vista === 'publicidad') return 'Anunciar en RO · ' + s;
    if (r.vista === 'contacto') return 'Contacto · ' + s;
    return 'Página no encontrada · ' + s;
  }

  function pintar() {
    const r = parse();
    const vista = document.getElementById('view');

    resetAds();
    let html;
    if (r.vista === 'home') html = ViewHome();
    else if (r.vista === 'categoria') html = ViewCategoria(r.slug);
    else if (r.vista === 'nota') html = ViewNota(r.slug);
    else if (r.vista === 'radios') html = ViewRadios();
    else if (r.vista === 'audiovisual') html = ViewAudiovisual();
    else if (r.vista === 'publicidad') html = ViewPublicidad();
    else if (r.vista === 'contacto') html = ViewContacto();
    else html = ViewNotFound();

    vista.innerHTML = html;
    document.title = titulo(r);

    Chrome.marcarNav(
      r.vista === 'home' ? 'home' :
      r.vista === 'categoria' ? r.slug :
      r.vista === 'nota' ? (Store.porSlug[r.slug] || {}).cat :
      r.vista === 'radios' ? 'radios' :
      r.vista === 'audiovisual' ? 'audiovisual' : ''
    );

    AudioNota.activar(vista);
    YouTubeFacade.activar(vista);
    APP.emit('vista', r);

    /* posición de lectura */
    const clave = location.hash || '#/';
    if (navegacionPropia || posiciones[clave] == null) {
      window.scrollTo(0, 0);
    } else {
      const y = posiciones[clave];
      requestAnimationFrame(() => window.scrollTo(0, y));
    }
    navegacionPropia = false;
    actual = clave;
  }

  function iniciar() {
    /* Intercepta los clics internos para saber si la navegación es "hacia
       adelante" (debe arrancar arriba) o del historial (restaura posición). */
    document.addEventListener('click', (ev) => {
      const a = ev.target.closest('a[href^="#/"]');
      if (!a || a.target === '_blank') return;
      if (actual) posiciones[actual] = window.scrollY;
      navegacionPropia = true;
      if (a.getAttribute('href') === location.hash) {
        ev.preventDefault();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        navegacionPropia = false;
      }
    }, true);

    window.addEventListener('hashchange', () => {
      if (actual && !navegacionPropia) posiciones[actual] = posiciones[actual] || 0;
      pintar();
    });

    if (!location.hash) location.replace('#/');
    pintar();
  }

  return { iniciar: iniciar, ir: (h) => { location.hash = h; } };
})();


/* ===== src/app.js ===== */
/* ============================================================================
   RO CONTENIDOS · arranque
   ========================================================================== */

const APP = (function () {
  const oyentes = {};
  return {
    /* Fecha de referencia del prototipo: coherente con el contenido demo. */
    ahora: new Date('2026-09-11T09:30:00-03:00').getTime(),
    on: function (ev, fn) { (oyentes[ev] = oyentes[ev] || []).push(fn); },
    emit: function (ev, data) { (oyentes[ev] || []).forEach((f) => f(data)); },
  };
})();

function toast(msg) {
  let t = document.querySelector('.toast');
  if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); }
  t.textContent = msg;
  requestAnimationFrame(() => t.classList.add('show'));
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show'), 2400);
}

function boot() {
  document.body.insertAdjacentHTML('afterbegin',
    Chrome.demoBanner() + Chrome.topbar() + Chrome.header() +
    '<div id="view"></div>' + Chrome.footer() + Chrome.buscador() +
    '<div class="player" id="player"></div>');

  Radio.montar(document.getElementById('player'));
  Chrome.activarBuscador();
  Chrome.activarNavMas();
  Router.iniciar();

  /* --- botones "escuchar" repartidos por el sitio ---------------------- */
  document.addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-play-radio]');
    if (b) { Radio.elegir(+b.getAttribute('data-play-radio'), true); return; }

    const live = ev.target.closest('[data-act=live]');
    if (live && !Radio.estado().sonando) { Radio.play(); }

    /* --- compartir ---------------------------------------------------- */
    const sh = ev.target.closest('[data-share]');
    if (sh) {
      const url = location.href;
      const tit = document.title;
      const k = sh.getAttribute('data-share');
      if (k === 'link') {
        if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => toast('Enlace copiado'), () => toast('No se pudo copiar'));
        else toast('Enlace: ' + url);
      } else {
        const dest = {
          wa: 'https://api.whatsapp.com/send?text=' + encodeURIComponent(tit + ' ' + url),
          fb: 'https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(url),
          x: 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(tit) + '&url=' + encodeURIComponent(url),
        }[k];
        window.open(dest, '_blank', 'noopener,width=620,height=520');
      }
    }
  });

  /* Aviso la primera vez que el usuario pone play: el audio sigue al navegar */
  let avisado = false;
  APP.on('radio', (st) => {
    if (st.sonando && !avisado) {
      avisado = true;
      setTimeout(() => toast('Sonando ' + st.emisora.nombre + ' · podés seguir navegando'), 400);
    }
  });
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

</script>
